name: Kiez-Brief (weekly member mail)
# Rings GET /api/cron/kiez-brief on Sunday evening (GET like the other workflows — a bodiless
# POST without a content type trips the cross-site form check). Vercel Hobby allows one cron run a day and
# both vercel.json slots are taken (fetch-daily 06:00 UTC, process-deletions 05:30 UTC), so —
# like kiez-air-logger.yml and news-afternoon-fetch.yml — GitHub Actions rings the route.
# 15:00 UTC = 17:00 Berlin in summer (CEST) / 16:00 in winter (CET) — the test copy; the members'
# mail follows two hours later (owner, 2026-10-04). GitHub starts scheduled runs
# 0–4 h late, so "Sunday evening" is the promise. The issue is claimed per ISO week inside the
# app: if this run never arrives, the Monday 06:00 UTC cron (fetch-daily) sends it instead.
# Requires repo secret CRON_SECRET (same value as the Vercel env).
#
# The scheduled job has THREE steps (2026-10-04): (1) a test copy to the admin plus a Telegram
# line, (2) a two-hour wait so he can look at it, (3) the members' mail. So the members' mail
# lands about two hours after the job starts (19:00 Berlin + GitHub's lateness). Cancelling the
# run during the wait stops Sunday's send — the Monday 06:00 UTC fallback then sends unless the
# problem is fixed first. A manual dispatch skips steps 1 and 2 and sends at once.
# The wait must match TEST_LEAD_MINUTES in src/lib/newsletter/kiezBriefRules.ts.
on:
  schedule:
    - cron: '0 15 * * 0'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    # the two-hour wait plus slack
    timeout-minutes: 150
    steps:
      - name: Test copy to the admin, two hours before the send
        if: github.event_name == 'schedule'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_ORIGIN: https://mahalle.digital
        # A failed test copy must not stop the send: log the answer, never fail the step.
        run: |
          code=$(curl -s -o /tmp/test.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_ORIGIN/api/cron/kiez-brief-test") || true
          cat /tmp/test.json 2>/dev/null || true; echo
          echo "kiez-brief test copy: HTTP $code"
      - name: Give the admin two hours to look at it
        if: github.event_name == 'schedule'
        run: sleep 7200
      - name: Trigger the Kiez-Brief
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Canonical domain — never the *.vercel.app origin (308 redirect; curl drops the
          # Authorization header across hosts, see kiez-air-logger.yml).
          APP_ORIGIN: https://mahalle.digital
        run: |
          code=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_ORIGIN/api/cron/kiez-brief")
          cat /tmp/resp.json; echo
          if [ "$code" != "200" ]; then
            echo "kiez-brief trigger failed with HTTP $code"
            exit 1
          fi
